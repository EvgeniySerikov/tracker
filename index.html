<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Трекер 3 Личности</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    button {
      padding: 10px;
      margin: 5px 0;
      font-size: 1rem;
    }
    textarea, input {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      font-size: 1rem;
    }
    .idea, .row {
      border: 1px solid #ccc;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 6px;
      background: #f9f9f9;
    }
    .grid {
      display: grid;
      grid-template-columns: auto auto auto auto auto auto auto;
      gap: 6px;
      font-size: 0.85rem;
    }
    .grid-header {
      font-weight: bold;
      background: #eee;
    }
  </style>
</head>
<body>
  <h1>📅 Трекер 3 Личности</h1>
  <div>
    <button onclick="toggle('brain')">🧠 Предприниматель</button>
    <button onclick="toggle('chart')">📊 Менеджер</button>
    <button onclick="toggle('muscle')">💪 Специалист</button>
  </div>
  <input type="number" id="score" placeholder="Оценка дня (1–10)">
  <textarea id="comment" placeholder="Комментарий"></textarea>
  <button onclick="save()">💾 Сохранить</button>

  <div id="trackerTable"></div>

  <hr style="margin: 40px 0;"/>

  <h2>💡 Идеи предпринимателя</h2>
  <textarea id="newIdea" placeholder="Опиши идею или точку роста"></textarea>
  <button onclick="addIdea()">➕ Добавить</button>
  <button onclick="copyWeeklyPrompt()">📋 Копировать идеи за неделю</button>
  <div id="ideaList"></div>

  <script>
    let selected = { brain: false, chart: false, muscle: false };

    function toggle(key) {
      selected[key] = !selected[key];
      document.querySelectorAll('button').forEach(btn => {
        if (btn.textContent.includes('🧠')) btn.style.background = selected.brain ? '#cdf' : '';
        if (btn.textContent.includes('📊')) btn.style.background = selected.chart ? '#cdf' : '';
        if (btn.textContent.includes('💪')) btn.style.background = selected.muscle ? '#cdf' : '';
      });
    }

    function save() {
      const score = document.getElementById("score").value;
      const comment = document.getElementById("comment").value;
      if (!score) return alert("Укажи оценку");

      const date = new Date().toISOString().split("T")[0];
      const data = JSON.parse(localStorage.getItem("threeRolesTracker") || "[]");
      data.unshift({ date, ...selected, score, comment });
      localStorage.setItem("threeRolesTracker", JSON.stringify(data));
      document.getElementById("score").value = "";
      document.getElementById("comment").value = "";
      selected = { brain: false, chart: false, muscle: false };
      renderTracker();
      toggle(); // reset button styles
    }

    function renderTracker() {
      const data = JSON.parse(localStorage.getItem("threeRolesTracker") || "[]");
      const table = document.getElementById("trackerTable");
      if (data.length === 0) return table.innerHTML = "<p>Записей пока нет.</p>";

      let html = '<div class="grid grid-header"><div>Дата</div><div>🧠</div><div>📊</div><div>💪</div><div>Оценка</div><div>Комментарий</div><div>Статус</div></div>';
      data.forEach(row => {
        const status = row.brain && row.chart && row.muscle ? '🔥' : (row.brain || row.chart || row.muscle ? '⚠' : '💤');
        html += `<div class="grid row">
          <div>${row.date}</div>
          <div>${row.brain ? '✅' : ''}</div>
          <div>${row.chart ? '✅' : ''}</div>
          <div>${row.muscle ? '✅' : ''}</div>
          <div>${row.score}</div>
          <div>${row.comment}</div>
          <div>${status}</div>
        </div>`;
      });
      table.innerHTML = html;
    }

    function loadIdeas() {
      const saved = JSON.parse(localStorage.getItem("threeRolesIdeas") || "[]");
      const ideaList = document.getElementById("ideaList");
      ideaList.innerHTML = "";
      saved.forEach(({ date, text }) => {
        const el = document.createElement("div");
        el.className = "idea";
        el.innerHTML = `<div style='font-size:0.8rem;color:gray;'>${date}</div><div>${text}</div>`;
        ideaList.appendChild(el);
      });
    }

    function addIdea() {
      const text = document.getElementById("newIdea").value.trim();
      if (!text) return;
      const saved = JSON.parse(localStorage.getItem("threeRolesIdeas") || "[]");
      const date = new Date().toISOString().split("T")[0];
      saved.unshift({ date, text });
      localStorage.setItem("threeRolesIdeas", JSON.stringify(saved));
      document.getElementById("newIdea").value = "";
      loadIdeas();
    }

    function copyWeeklyPrompt() {
      const saved = JSON.parse(localStorage.getItem("threeRolesIdeas") || "[]");
      const oneWeekAgo = new Date();
      oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
      const weekly = saved.filter(i => new Date(i.date) >= oneWeekAgo);
      if (weekly.length === 0) return alert("За последнюю неделю идей нет.");
      const list = weekly.map((i, idx) => `${idx + 1}. ${i.text}`).join("\n");
      const prompt = `Вот мои идеи за неделю:\n\n${list}\n\nПроанализируй каждую по пунктам:\n1. Каков потенциал этой идеи?\n2. Насколько сложно её реализовать?\n3. Что нужно для запуска?\n4. Какие риски?\n5. Какие первые 3 шага?`;
      navigator.clipboard.writeText(prompt);
      alert("Скопировано! Открой ChatGPT и вставь.");
    }

    renderTracker();
    loadIdeas();
  </script>

<script>
  // Добавим пояснение
  const info = document.createElement("div");
  info.innerHTML = `
    <h3>📘 Как использовать трекер</h3>
    <p>Ты — предприниматель, в котором живут три личности:</p>
    <ul>
      <li>🧠 <b>Предприниматель</b>: стратегия, идеи, масштаб</li>
      <li>📊 <b>Менеджер</b>: организация, системность, делегирование</li>
      <li>💪 <b>Специалист</b>: исполнение, работа руками</li>
    </ul>
    <p>🔥 = все три роли были активны · ⚠ = частично · 💤 = неактивный день</p>
  `;
  document.body.insertBefore(info, document.body.children[1]);

  // Оценка дня — селект
  const scoreInput = document.getElementById("score");
  const scoreSelect = document.createElement("select");
  scoreSelect.id = "score";
  scoreSelect.innerHTML = "<option value=''>Оценка дня (1–10)</option>" +
    Array.from({length: 10}, (_, i) => `<option value='${i+1}'>${i+1}</option>`).join("");
  scoreInput.replaceWith(scoreSelect);

  // Удаление идеи
  function deleteIdea(index) {
    const saved = JSON.parse(localStorage.getItem("threeRolesIdeas") || "[]");
    saved.splice(index, 1);
    localStorage.setItem("threeRolesIdeas", JSON.stringify(saved));
    loadIdeas();
  }

  // Рендер идей с удалением
  function loadIdeas() {
    const saved = JSON.parse(localStorage.getItem("threeRolesIdeas") || "[]");
    const container = document.getElementById("ideaList");
    container.innerHTML = "";
    saved.forEach(({ date, text }, index) => {
      const div = document.createElement("div");
      div.className = "idea";
      div.innerHTML = `
        <div style='font-size:0.8rem;color:gray;'>${date}</div>
        <div>${text}</div>
        <button onclick='deleteIdea(${index})'>🗑 Удалить</button>
      `;
      container.appendChild(div);
    });
  }

  // Анализ недели из трекера
  function copyWeeklyTable() {
    const data = JSON.parse(localStorage.getItem("threeRolesTracker") || "[]");
    const oneWeekAgo = new Date();
    oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
    const weekly = data.filter(i => new Date(i.date) >= oneWeekAgo);
    if (weekly.length === 0) return alert("Нет данных за неделю.");
    const rows = weekly.map(d =>
      `${d.date}: 🧠 ${d.brain ? '✅' : '–'}, 📊 ${d.chart ? '✅' : '–'}, 💪 ${d.muscle ? '✅' : '–'}, Оценка: ${d.score}, Коммент: ${d.comment}`
    ).join("\n");
    const prompt = `Я использую трекер предпринимателя из книги Майкла Гербера. Каждый день я отмечаю, какая личность была активна: Предприниматель (🧠), Менеджер (📊), Специалист (💪). Вот мои записи за неделю:\n\n${rows}\n\nПроанализируй:\n1. Где я молодец?\n2. Что можно улучшить?\n3. Какие роли были недопредставлены?\n4. Как сбалансировать роли?\n5. Похвали и замотивируй меня.`;
    navigator.clipboard.writeText(prompt);
    alert("Скопировано! Вставь в ChatGPT.");
  }

  // Добавим кнопку анализа под таблицу
  const table = document.getElementById("trackerTable");
  if (table) {
    const btn = document.createElement("button");
    btn.textContent = "📋 Анализ недели с промптом";
    btn.onclick = copyWeeklyTable;
    btn.style.margin = "20px 0";
    table.insertAdjacentElement("afterend", btn);
  }
</script>
</body>

</html>
